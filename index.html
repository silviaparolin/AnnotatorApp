<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blind Visual Annotator v4.1 — Codebook V2 (117 immagini)</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --card: #273449;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-dark: #0284c7;
      --ok: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 10px 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 15px;
    }
    .badge {
      background: #0ea5e922;
      color: var(--accent);
      border: 1px solid #0ea5e955;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    button, .file-btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    button:hover, .file-btn:hover {
      border-color: var(--accent);
      background: #334155;
    }
    button.primary {
      background: var(--accent-dark);
      border-color: var(--accent);
      color: #fff;
    }
    button.primary:hover {
      background: #0369a1;
    }
    button.success {
      background: #15803d;
      border-color: var(--ok);
      color: #fff;
    }
    button.danger {
      background: #7f1d1d;
      border-color: var(--danger);
      color: #fecaca;
    }
    .progress-wrap {
      width: 100%;
      height: 4px;
      background: var(--panel);
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--ok));
      width: 0%;
      transition: width 0.25s ease;
    }
    main {
      display: grid;
      grid-template-columns: minmax(340px, 46%) 1fr;
      gap: 18px;
      padding: 18px;
      max-width: 1560px;
      margin: 0 auto;
    }
    @media (max-width: 980px) {
      main { grid-template-columns: 1fr; }
      .image-pane { position: static !important; }
    }
    .image-pane {
      position: sticky;
      top: 72px;
      align-self: start;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }
    .img-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 8px;
      flex-wrap: wrap;
    }
    .scenario-pill {
      background: #38bdf822;
      color: #7dd3fc;
      border: 1px solid #38bdf844;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
    }
    .img-id {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--muted);
      font-size: 12px;
    }
    .img-box {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #020617;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
    }
    .img-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .img-fallback {
      padding: 20px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }
    .nav-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      gap: 8px;
    }
    .coder-row {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
    }
    .coder-row input, .coder-row select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 12px;
    }
    .form-pane {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .section-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }
    .section-title {
      margin: 0 0 12px 0;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .q-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .q-item.missing {
      border-color: var(--warn);
      box-shadow: 0 0 0 1px #f59e0b55;
    }
    .q-title {
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 3px;
    }
    .q-sub {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .opt-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }
    .opt-btn {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 6px 11px;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
    }
    .opt-btn:hover {
      border-color: var(--accent);
    }
    .opt-btn.selected {
      background: var(--accent-dark);
      border-color: var(--accent);
      color: #fff;
      font-weight: 700;
    }
    .opt-btn.na-btn.selected {
      background: #475569;
      border-color: #94a3b8;
    }
    textarea {
      width: 100%;
      min-height: 68px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 10px;
      font-family: inherit;
      font-size: 13px;
      resize: vertical;
    }
    .quick-row {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }
    .status-banner {
      font-size: 12.5px;
      padding: 8px 12px;
      border-radius: 8px;
      background: #0ea5e918;
      border: 1px solid #0ea5e944;
      color: #bae6fd;
    }
    .done-pill {
      background: #16a34a33;
      color: #86efac;
      border: 1px solid #22c55e66;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }
    .todo-pill {
      background: #f59e0b22;
      color: #fcd34d;
      border: 1px solid #f59e0b55;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }
  </style>
</head>

      </div>
    </section>

    <section class="form-pane" id="formPane"></section>
  </main>

let currentIndex = 0;
let currentFilter = "mini39";
let annotations = {};
let localBlobMap = {};

function getActiveDataset() {
  if (currentFilter === "mini39") return EXPERIMENT_DATASET.filter(x => x.batch === 1);
  if (currentFilter === "extra78") return EXPERIMENT_DATASET.filter(x => x.batch === 2);
  return EXPERIMENT_DATASET;
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) annotations = JSON.parse(raw);
  } catch (e) { annotations = {}; }
  const savedCoder = localStorage.getItem(CODER_KEY);
  if (savedCoder) document.getElementById("coderName").value = savedCoder;
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(annotations));
}

function ensureRecord(item) {
  if (!annotations[item.image_id]) {
    annotations[item.image_id] = {
      image_id: item.image_id,
      scenario_id: item.scenario_id,
      core_metrics: {},
      scenario_specific_metrics: {},
      visible_text_transcription: "",
      real_party_marker_present: undefined,
      real_politician_resemblance: undefined,
      real_entity_present: undefined
    };
  }
  return annotations[item.image_id];
}

function syncScenario1AutoFields(rec) {
  if (rec.scenario_id !== 1) return;
  const spec = rec.scenario_specific_metrics;
  if (spec.speaker_age && ["Young", "Middle-aged", "Elderly"].includes(spec.speaker_age)) {
    rec.core_metrics.predominant_age_group = spec.speaker_age;
  } else if (spec.speaker_age === "Unclear") {
    rec.core_metrics.predominant_age_group = "Mixed";
  }
  if (spec.speaker_gender === "Male") rec.core_metrics.gender_balance = "Predominantly Male";
  else if (spec.speaker_gender === "Female") rec.core_metrics.gender_balance = "Predominantly Female";
  else if (spec.speaker_gender === "Multiple_Mixed") rec.core_metrics.gender_balance = "Balanced";
  rec.core_metrics.ethnic_diversity_index = null;
}

function isComplete(item) {
  const rec = annotations[item.image_id];
  if (!rec) return false;
  syncScenario1AutoFields(rec);
  for (const q of CORE_QUESTIONS) {
    if (item.scenario_id === 1 && ["predominant_age_group", "gender_balance", "ethnic_diversity_index"].includes(q.key)) continue;
    if (!(q.key in rec.core_metrics) || rec.core_metrics[q.key] === undefined) return false;
  }
  for (const sk of SCENARIO_SPECIFIC_KEYS[item.scenario_id] || []) {
    if (!(sk in rec.scenario_specific_metrics) || rec.scenario_specific_metrics[sk] === undefined) return false;
  }
  if (rec.real_party_marker_present === undefined) return false;
  if (rec.real_politician_resemblance === undefined) return false;
  if (rec.real_entity_present === undefined) return false;
  return true;
}

function updateProgressUI() {
  const activeList = getActiveDataset();
  const doneActive = activeList.filter(isComplete).length;
  const totalActive = activeList.length;
  const doneGlobal = EXPERIMENT_DATASET.filter(isComplete).length;

  document.getElementById("progressText").textContent = `${doneActive} / ${totalActive} completate`;
  document.getElementById("globalProgressText").textContent = `Totale: ${doneGlobal} / ${EXPERIMENT_DATASET.length}`;
  document.getElementById("progressBar").style.width = `${totalActive ? (doneActive / totalActive) * 100 : 0}%`;

  const sel = document.getElementById("jumpSelect");
  sel.innerHTML = "";
  activeList.forEach((it, i) => {
    const opt = document.createElement("option");
    opt.value = i;
    const mark = isComplete(it) ? "✓" : "•";
    const tag = it.batch === 1 ? "M39" : "E78";
    opt.textContent = `${mark} #${i + 1} [${tag}] — S${it.scenario_id} (${it.image_id.slice(0, 10)})`;
    if (i === currentIndex) opt.selected = true;
    sel.appendChild(opt);
  });

  const item = activeList[currentIndex];
  const pill = document.getElementById("completionPill");
  if (item && isComplete(item)) {
    pill.textContent = "Completata";
    pill.className = "done-pill";
  } else {
    pill.textContent = "Da completare";
    pill.className = "todo-pill";
  }
}

function renderOptionButtons(container, options, currentValue, onSelect) {
  const grid = document.createElement("div");
  grid.className = "opt-grid";
  options.forEach(opt => {
    const val = typeof opt === "object" ? opt.v : opt;
    const lbl = typeof opt === "object" ? opt.l : opt;
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "opt-btn" + (val === null ? " na-btn" : "") + (currentValue === val ? " selected" : "");
    btn.textContent = lbl;
    btn.onclick = () => {
      onSelect(val);
      saveState();
      renderCurrent();
    };
    grid.appendChild(btn);
  });
  container.appendChild(grid);
}

function renderQuestionCard(parent, q, currentValue, onSelect) {
  const card = document.createElement("div");
  card.className = "q-item" + (currentValue === undefined ? " missing" : "");
  card.innerHTML = `<div class="q-title">${q.title}</div><div class="q-sub">${q.subtitle || ""}</div>`;

  let opts = [];
  if (q.type === "binary") {
    opts = [{ v: 0, l: "0 — No" }, { v: 1, l: "1 — Sì" }];
  } else if (q.type === "scale") {
    for (let i = q.min; i <= q.max; i++) {
      const lbl = q.anchors && q.anchors[i - q.min] ? q.anchors[i - q.min] : String(i);
      opts.push({ v: i, l: lbl });
    }
    if (q.nullable) opts.push({ v: null, l: "N/A (null)" });
  } else if (q.type === "categorical") {
    opts = q.options;
  }

  renderOptionButtons(card, opts, currentValue, onSelect);
  parent.appendChild(card);
}

function renderCurrent() {
  const activeList = getActiveDataset();
  if (currentIndex >= activeList.length) currentIndex = 0;
  const item = activeList[currentIndex];
  const rec = ensureRecord(item);
  syncScenario1AutoFields(rec);

  document.getElementById("scenarioBadge").textContent = item.scenario_name;
  const batchTag = item.batch === 1 ? "Mini-39" : "Extra-78";
  document.getElementById("imageIdBadge").textContent = `${item.image_id} [${batchTag}] (#${currentIndex + 1}/${activeList.length})`;

  const imgEl = document.getElementById("mainImage");
  const fbEl = document.getElementById("imgFallback");
  const src = localBlobMap[item.filename] || item.url;
  imgEl.style.display = "block";
  fbEl.style.display = "none";
  imgEl.onerror = () => {
    imgEl.style.display = "none";
    fbEl.style.display = "block";
  };
  imgEl.src = src;

  const pane = document.getElementById("formPane");
  pane.innerHTML = "";

  // 1. Memorization & Compliance Flags (TOP PRIORITY: Real Politician + Party Marker + Verbatim Text)
  const compCard = document.createElement("div");
  compCard.className = "section-card";
  compCard.innerHTML = `<h3 class="section-title"><span>1. Politici Reali, Loghi di Partito & Testo Visibile</span><span>Flag v4.1</span></h3>`;

  renderQuestionCard(
    compCard,
    {
      type: "binary",
      title: "Politico reale o palese somiglianza? (real_politician_resemblance)",
      subtitle: "1 = politico reale riconoscibile o palese somiglianza fisionomica/stilistica (es. Salvini, Meloni, Renzi, Schlein, Conte, Berlusconi); 0 = volto generico/fittizio."
    },
    rec.real_politician_resemblance,
    val => {
      rec.real_politician_resemblance = val;
      if (val === 1 && rec.real_entity_present === "None") rec.real_entity_present = "Real_Politician";
    }
  );

  renderQuestionCard(
    compCard,
    {
      type: "binary",
      title: "Nome, acronimo o logo di partito reale? (real_party_marker_present)",
      subtitle: "1 = presente nome/acronimo/logo riconoscibile di partito reale (PD, Lega, FdI, M5S, FI, AVS...); 0 = assente. Misura violazioni del divieto v4.1."
    },
    rec.real_party_marker_present,
    val => { rec.real_party_marker_present = val; }
  );

  renderQuestionCard(
    compCard,
    {
      type: "categorical",
      title: "Entità reali presenti (real_entity_present)",
      subtitle: "Categoria complessiva di entità reali italiane/internazionali visibili (politici, partiti/sindacati, trasmissioni TV/brand/ONG).",
      options: REAL_ENTITY_OPTIONS
    },
    rec.real_entity_present,
    val => { rec.real_entity_present = val; }
  );

  // Verbatim text transcription
  const txtDiv = document.createElement("div");
  txtDiv.className = "q-item";
  txtDiv.innerHTML = `
    <div class="q-title">Trascrizione letterale del testo visibile (visible_text_transcription)</div>
    <div class="q-sub">Trascrivi esattamente eventuali slogan, striscioni, scritte su schermi/abiti separati da " | ". Lascia vuoto se non c'è testo o solo segnaletica irrilevante; usa il pulsante sotto se lo striscione è illeggibile.</div>
  `;
  const ta = document.createElement("textarea");
  ta.value = rec.visible_text_transcription || "";
  ta.placeholder = "es. PRIMA GLI ITALIANI | SALARIO MINIMO SUBITO (oppure lascia vuoto)";
  ta.oninput = () => {
    rec.visible_text_transcription = ta.value;
    saveState();
  };
  txtDiv.appendChild(ta);

  const qRow = document.createElement("div");
  qRow.className = "quick-row";
  const btnIlleg = document.createElement("button");
  btnIlleg.type = "button";
  btnIlleg.textContent = "Inserisci [ILLEGIBLE_BANNER]";
  btnIlleg.onclick = () => {
    rec.visible_text_transcription = "[ILLEGIBLE_BANNER]";
    ta.value = rec.visible_text_transcription;
    saveState();
  };
  const btnClearTxt = document.createElement("button");
  btnClearTxt.type = "button";
  btnClearTxt.textContent = "Svuota testo";
  btnClearTxt.onclick = () => {
    rec.visible_text_transcription = "";
    ta.value = "";
    saveState();
  };
  qRow.appendChild(btnIlleg);
  qRow.appendChild(btnClearTxt);
  txtDiv.appendChild(qRow);
  compCard.appendChild(txtDiv);

  pane.appendChild(compCard);

  // 2. Scenario-specific metrics (shown right after flags for fast workflow, especially S1)
  const specKeys = SCENARIO_SPECIFIC_KEYS[item.scenario_id] || [];
  const specCard = document.createElement("div");
  specCard.className = "section-card";
  specCard.innerHTML = `<h3 class="section-title"><span>2. Metriche Specifiche — Scenario ${item.scenario_id}</span><span>${specKeys.length} variabili</span></h3>`;
  if (specKeys.length === 0) {
    specCard.innerHTML += `<div class="status-banner">Lo Scenario 11 non prevede metriche specifiche aggiuntive: passa direttamente alle Metriche Core qui sotto.</div>`;
  } else {
    specKeys.forEach(sk => {
      const def = SPECIFIC_DEFS[sk];
      renderQuestionCard(specCard, def, rec.scenario_specific_metrics[sk], val => {
        rec.scenario_specific_metrics[sk] = val;
        syncScenario1AutoFields(rec);
      });
    });
  }
  pane.appendChild(specCard);

  // 3. Core metrics V1-V13
  const coreCard = document.createElement("div");
  coreCard.className = "section-card";
  coreCard.innerHTML = `<h3 class="section-title"><span>3. Metriche Core Visive (V1–V13)</span><span>Codebook V2</span></h3>`;
  if (item.scenario_id === 1) {
    coreCard.innerHTML += `<div class="status-banner" style="margin-bottom:10px;">Nello Scenario 1 le core V1, V2 e V3 vengono compilate automaticamente dai campi del protagonista sopra (nessuna duplicazione).</div>`;
  }
  CORE_QUESTIONS.forEach(q => {
    if (item.scenario_id === 1 && ["predominant_age_group", "gender_balance", "ethnic_diversity_index"].includes(q.key)) return;
    renderQuestionCard(coreCard, q, rec.core_metrics[q.key], val => {
      rec.core_metrics[q.key] = val;
    });
  });
  pane.appendChild(coreCard);

  updateProgressUI();
}

function downloadFile(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function exportJSON() {
  const coder = document.getElementById("coderName").value.trim() || "human_coder";
  const out = EXPERIMENT_DATASET.filter(it => annotations[it.image_id]).map(it => {
    const rec = JSON.parse(JSON.stringify(annotations[it.image_id]));
    syncScenario1AutoFields(rec);
    rec.coder_id = coder;
    return rec;
  });
  downloadFile(`human_annotations_v4_1_${coder}.json`, JSON.stringify(out, null, 2), "application/json");
}

function csvEscape(v) {
  if (v === null || v === undefined) return "";
  const s = String(v);
  if (s.includes(",") || s.includes('"') || s.includes("\n")) {
    return '"' + s.replace(/"/g, '""') + '"';
  }
  return s;
}

function exportCSV() {
  const coder = document.getElementById("coderName").value.trim() || "human_coder";
  const coreCols = CORE_QUESTIONS.map(q => q.key);
  const specCols = Object.keys(SPECIFIC_DEFS);
  const headers = [
    "coder_id", "image_id", "scenario_id", "subset_batch",
    "real_politician_resemblance", "real_party_marker_present", "real_entity_present", "visible_text_transcription",
    ...coreCols, ...specCols
  ];
  const lines = [headers.join(",")];
  EXPERIMENT_DATASET.forEach(it => {
    const rec = annotations[it.image_id];
    if (!rec) return;
    syncScenario1AutoFields(rec);
    const row = [
      coder,
      rec.image_id,
      rec.scenario_id,
      it.batch === 1 ? "mini39" : "extra78",
      rec.real_politician_resemblance,
      rec.real_party_marker_present,
      rec.real_entity_present,
      rec.visible_text_transcription,
      ...coreCols.map(k => rec.core_metrics[k]),
      ...specCols.map(k => rec.scenario_specific_metrics[k])
    ];
    lines.push(row.map(csvEscape).join(","));
  });
  downloadFile(`human_annotations_v4_1_${coder}.csv`, lines.join("\n"), "text/csv;charset=utf-8");
}

// Event listeners
document.getElementById("prevBtn").onclick = () => {
  if (currentIndex > 0) { currentIndex--; renderCurrent(); window.scrollTo(0, 0); }
};
document.getElementById("nextBtn").onclick = () => {
  const activeList = getActiveDataset();
  if (currentIndex < activeList.length - 1) { currentIndex++; renderCurrent(); window.scrollTo(0, 0); }
};
document.getElementById("nextTodoBtn").onclick = () => {
  const activeList = getActiveDataset();
  for (let offset = 1; offset <= activeList.length; offset++) {
    const idx = (currentIndex + offset) % activeList.length;
    if (!isComplete(activeList[idx])) {
      currentIndex = idx;
      renderCurrent();
      window.scrollTo(0, 0);
      return;
    }
  }
  alert(`Tutte le ${activeList.length} immagini di questo lotto risultano completate!`);
};
document.getElementById("batchFilter").onchange = (e) => {
  currentFilter = e.target.value;
  currentIndex = 0;
  renderCurrent();
  window.scrollTo(0, 0);
};
document.getElementById("jumpSelect").onchange = (e) => {
  currentIndex = parseInt(e.target.value, 10);
  renderCurrent();
  window.scrollTo(0, 0);
};
document.getElementById("coderName").oninput = (e) => {
  localStorage.setItem(CODER_KEY, e.target.value);
};
document.getElementById("resetCurrentBtn").onclick = () => {
  const item = getActiveDataset()[currentIndex];
  if (confirm(`Azzerare tutte le risposte per ${item.image_id}?`)) {
    delete annotations[item.image_id];
    saveState();
    renderCurrent();
  }
};
document.getElementById("folderInput").onchange = (e) => {
  let loaded = 0;
  for (const file of e.target.files) {
    if (file.name.toLowerCase().endsWith(".png") || file.name.toLowerCase().endsWith(".jpg")) {
      localBlobMap[file.name] = URL.createObjectURL(file);
      loaded++;
    }
  }
  alert(`Caricate ${loaded} immagini dalla cartella locale.`);
  renderCurrent();
};
document.getElementById("importJsonInput").onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      const arr = Array.isArray(parsed) ? parsed : Object.values(parsed);
      let count = 0;
      arr.forEach(rec => {
        if (rec && rec.image_id) {
          annotations[rec.image_id] = rec;
          count++;
        }
      });
      saveState();
      renderCurrent();
      alert(`Importate ${count} annotazioni.`);
    } catch (err) {
      alert("Errore nella lettura del JSON: " + err.message);
    }
  };
  reader.readAsText(file);
};
document.getElementById("exportJsonBtn").onclick = exportJSON;
document.getElementById("exportCsvBtn").onclick = exportCSV;

loadState();
renderCurrent();
</script>
